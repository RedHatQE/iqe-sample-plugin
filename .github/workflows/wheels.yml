name: Build and Publish IQE Wheels

on:
  schedule:
    # Daily: pick up new PyPI versions.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      package_spec:
        description: "Override packages (space-separated pip specifiers). Empty uses packages.json."
        required: false
        default: ""
  push:
    branches: [main, master]
    paths:
      - "packages.json"
      - "scripts/**"
      - ".github/workflows/wheels.yml"
  pull_request:
    paths:
      - "packages.json"
      - "scripts/**"
      - ".github/workflows/wheels.yml"

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: false

jobs:
  config:
    name: Read matrix
    runs-on: ubuntu-latest
    outputs:
      python_versions: ${{ steps.set.outputs.python_versions }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        run: echo "python_versions=$(jq -c .python_versions packages.json)" >> "${GITHUB_OUTPUT}"

  build-linux:
    name: linux-manylinux-py${{ matrix.python-version }}
    needs: config
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(needs.config.outputs.python_versions) }}
    steps:
      - uses: actions/checkout@v4

      - name: Build manylinux wheels
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
          PACKAGE_SPEC: ${{ github.event.inputs.package_spec }}
        run: |
          chmod +x scripts/*.sh
          docker run --rm \
            -v "${PWD}:/io" \
            -e PYTHON_VERSION \
            -e PACKAGE_SPEC \
            quay.io/pypa/manylinux_2_28_x86_64:latest \
            bash /io/scripts/build_manylinux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-py${{ matrix.python-version }}-linux
          path: wheels
          if-no-files-found: error

  build-macos:
    name: ${{ matrix.os }}-py${{ matrix.python-version }}
    needs: config
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        python-version: ${{ fromJson(needs.config.outputs.python_versions) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build dependencies
        run: |
          brew install krb5 cmake swig openssl@3
          python -m pip install -U pip setuptools wheel build Cython
          echo "PATH=$(brew --prefix krb5)/bin:${PATH}" >> "${GITHUB_ENV}"
          echo "CFLAGS=-I$(brew --prefix krb5)/include -I$(brew --prefix openssl@3)/include" >> "${GITHUB_ENV}"
          echo "LDFLAGS=-L$(brew --prefix krb5)/lib -L$(brew --prefix openssl@3)/lib" >> "${GITHUB_ENV}"
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "${GITHUB_ENV}"

      - name: Build wheels
        env:
          PACKAGE_SPEC: ${{ github.event.inputs.package_spec }}
          PYTHON: python
        run: |
          chmod +x scripts/*.sh
          ./scripts/build_wheels.sh

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-py${{ matrix.python-version }}-${{ matrix.os }}
          path: wheels
          if-no-files-found: error

  validate:
    name: Validate built wheels
    needs: [build-linux, build-macos]
    if: |
      always() &&
      needs.build-linux.result != 'cancelled' &&
      needs.build-macos.result != 'cancelled' &&
      (needs.build-linux.result == 'success' || needs.build-macos.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: built-wheels
          merge-multiple: true

      - name: Validate wheel archives
        run: |
          chmod +x scripts/*.sh
          python3 scripts/validate_wheels.py built-wheels

      - name: Dry-run simple index generation
        run: |
          mkdir -p dry-run/packages
          cp -a built-wheels/*.whl dry-run/packages/
          python3 scripts/generate_index.py dry-run \
            --simple-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/simple"

  publish:
    name: Publish GitHub Pages index
    needs: [build-linux, build-macos, validate]
    if: |
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      needs.build-linux.result == 'success' &&
      needs.build-macos.result == 'success' &&
      needs.validate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch existing Pages site
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: previous-site

      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: new-wheels
          merge-multiple: true

      - name: Merge validated wheels and generate simple index
        run: |
          chmod +x scripts/*.sh
          bash scripts/merge_site.sh \
            previous-site \
            new-wheels \
            site \
            "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/simple"

      - name: Publish gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
          enable_jekyll: false
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
